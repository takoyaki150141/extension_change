[package]
name = "extension_change_host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ExtensionChange"
path = "src/main.rs"

[dependencies]
extension_change_core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
woff = "0.6"
rquickjs = "0.14"
native-windows-gui = "1.0.13"
wait-timeout = "0.2"
calamine = "0.26"
csv = "1.3"
rust_xlsxwriter = "0.79"
pulldown-cmark = "0.12"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
